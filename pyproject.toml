[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostics-cli"
version = "1.0.0"
description = "Developer Environment Diagnostics CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Your Name" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black",
    "ruff"
]

[project.scripts]
diagnostics = "diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]